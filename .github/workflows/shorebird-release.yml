# Creates a Shorebird release (store binary). Requires SHOREBIRD_TOKEN secret.
# Trigger: push tag v* (e.g. v1.0.0+12) or manual workflow_dispatch.
#
# Android runs on ubuntu. iOS requires macos and signing setup.
# Upload the produced artifact to Play / App Store Connect as usual.
#
# Signing: android/key.properties is generated from repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
# ANDROID_STORE_PASSWORD. Release builds fail without it (no debug-key fallback).
#
# App config: BASE_URL / SUPPORT_PHONE are compile-time dart-defines with
# production defaults (lib/app/config/app_env.dart). To override, append e.g.
#   args: --no-confirm -- --dart-define=BASE_URL=https://...
# No .env file is needed or bundled.

name: Shorebird Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - both
      flutter_version:
        description: >-
          Flutter version to build with. Blank reads it from ci.yml, so the
          release is built on the same SDK the repository tests on. "latest"
          follows Shorebird's newest stable instead.
        required: false
        type: string
      dry_run:
        description: >-
          Validate the whole release path without publishing. Nothing is
          registered with Shorebird and no version number is consumed.
        required: false
        default: false
        type: boolean

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  # One run, one list. Before this existed, a missing secret was found a job
  # at a time: the Android job stopped at the keystore, the iOS job stopped at
  # "You must be logged in", and neither mentioned the other three. Somebody
  # fixed one, re-ran, and met the next.
  #
  # This job names everything that is missing at once, and fails before any
  # build starts, so nothing is half-shipped while a credential is absent.
  preflight:
    name: Check the credentials exist
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets are set
        env:
          SB: ${{ secrets.SHOREBIRD_TOKEN }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SPW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY }}
          MAPS_DEDICATED: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -uo pipefail
          missing=0
          check () {
            if [ -z "${2:-}" ]; then
              echo "::error::MISSING  $1 — $3"
              missing=1
            else
              echo "ok       $1"
            fi
          }
          check SHOREBIRD_TOKEN          "${SB:-}"    "console.shorebird.dev -> service account key. Without it nothing can be released or patched, on either platform."
          check ANDROID_KEYSTORE_BASE64  "${KS:-}"    "the Play upload keystore: base64 -w0 upload-keystore.jks"
          check ANDROID_KEY_ALIAS        "${ALIAS:-}" "the alias inside that keystore"
          check ANDROID_KEY_PASSWORD     "${KPW:-}"   "the key password"
          check ANDROID_STORE_PASSWORD   "${SPW:-}"   "the keystore password"

          # android/app/build.gradle applies com.google.gms.google-services,
          # and android/app/google-services.json is gitignored, so unless it is
          # supplied here the Android build fails on the Firebase task.
          if [ -f android/app/google-services.json ]; then
            echo "ok       google-services.json is in the repository"
          else
            check GOOGLE_SERVICES_JSON "${GSJ:-}" "base64 -w0 android/app/google-services.json — download it from Firebase console → Project settings → Your apps"
          fi

          # THE ONE THAT WOULD NOT HAVE FAILED THE BUILD.
          #
          # build.gradle reads this from .env or android/local.properties and
          # defaults it to an empty string, so without it the build succeeds
          # and ships an app whose map is blank - build.gradle's own warning
          # says exactly that. A delivery app with no map is worth failing a
          # build over.
          check GOOGLE_MAPS_API_KEY "${MAPS:-}" "the Android Maps SDK key, as GOOGLE_MAPS_API_KEY or VITE_GOOGLE_MAPS_API_KEY; without it the build passes and the map ships blank"

          # Reached the fallback, which is a web key by its name. A Maps key
          # restricted to HTTP referrers is rejected by the Maps SDK for
          # Android, and the symptom is the same blank map. Android needs a key
          # either unrestricted or restricted to Android apps (package name plus
          # signing SHA-1), with "Maps SDK for Android" enabled on the project.
          if [ -n "${MAPS:-}" ] && [ -z "${MAPS_DEDICATED:-}" ]; then
            echo "::warning::Using VITE_GOOGLE_MAPS_API_KEY. That name belongs to a web bundle; if the key is restricted to HTTP referrers, Android will reject it and the map ships blank anyway. Check its Application restrictions in Google Cloud Console, or add a separate Android key as GOOGLE_MAPS_API_KEY."
          fi
          if [ "$missing" = "1" ]; then
            echo
            echo "Add them at Settings -> Secrets and variables -> Actions."
            echo "Only the ANDROID_*, GOOGLE_SERVICES_JSON and GOOGLE_MAPS_API_KEY"
            echo "ones are needed for an Android build;"
            echo "iOS needs SHOREBIRD_TOKEN alone."
            exit 1
          fi
          echo "Every secret this build needs is present."

  release-android:
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'android' ||
      inputs.platform == 'both'
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create android/key.properties from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::Missing repository secret ${v}; release builds require the upload keystore."
              exit 1
            fi
          done
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"
          {
            echo "storeFile=${RUNNER_TEMP}/upload-keystore.jks"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/key.properties

      # Two more build inputs that live outside the repository.
      #
      # google-services.json is gitignored and the Firebase Gradle plugin fails
      # without it. The Maps key is the quieter one: build.gradle defaults it to
      # an empty string, so leaving it out produces a build that works and a map
      # that doesn't.
      - name: Create Firebase and Maps config from secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -f android/app/google-services.json ]; then
            echo "google-services.json already in the checkout; leaving it alone."
          else
            echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > android/app/google-services.json
            echo "google-services.json written from the secret."
          fi

          # Valid JSON is not enough. A file downloaded from one app's page in
          # the Firebase console may carry only that app's client entry, and
          # both repos read the same organisation-level secret - so the wrong
          # app's file decodes perfectly and then dies deep in the Gradle run
          # with "No matching client found for package name". This project also
          # has four Android apps with near-identical names, one of them the
          # Flutter template's com.example.hudhud_delivery, so picking the wrong
          # one is easy.
          APP_ID_PKG="$(grep -oE 'applicationId[[:space:]]*=?[[:space:]]*"[^"]+"' android/app/build.gradle \
                        | head -1 | grep -oE '"[^"]+"' | tr -d '"')"
          if [ -z "${APP_ID_PKG}" ]; then
            echo "::warning::Could not read applicationId from android/app/build.gradle; skipping the package-match check."
          else
            echo "applicationId: ${APP_ID_PKG}"
            GS_FILE=android/app/google-services.json APP_PKG="${APP_ID_PKG}" python3 - <<'PY'
          import json, os, sys

          path, want = os.environ["GS_FILE"], os.environ["APP_PKG"]
          try:
              data = json.load(open(path))
          except Exception as e:
              print(f"::error::{path} is not valid JSON ({e}). Re-copy the secret with: base64 -w0 google-services.json")
              sys.exit(1)

          found = []
          for client in data.get("client", []):
              pkg = client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              if pkg:
                  found.append(pkg)

          if want in found:
              print(f"ok       google-services.json contains a client for {want}")
              sys.exit(0)

          print(f"::error::google-services.json has no client for {want}. It contains: {', '.join(found) or '(none)'}")
          print("Download it from the Firebase console page for THAT app, or use a file that")
          print("contains every app in the project. Beware com.example.hudhud_delivery - it is a")
          print("leftover placeholder registration, not this app.")
          sys.exit(1)
          PY
          fi

          # build.gradle reads this key out of android/local.properties, which is
          # gitignored, so it is appended rather than written over whatever the
          # runner already put there.
          touch android/local.properties
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "::error::No Maps key in GOOGLE_MAPS_API_KEY or VITE_GOOGLE_MAPS_API_KEY. build.gradle would default it to an empty string and ship a blank map."
            exit 1
          fi
          echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" >> android/local.properties
          echo "Maps key appended to android/local.properties."

      # shorebird-release declares flutter-version as REQUIRED and forwards it
      # unconditionally - `shorebird release <platform> --flutter-version "$V"`
      # - so leaving it out sends an empty string and the CLI answers:
      #
      #     Flutter  is not available to Shorebird.
      #
      # That doubled space IS the empty version, and nothing in the message
      # points back at a missing workflow input. It is what the first real
      # release attempt died on.
      #
      # The version is read from ci.yml so a release is built on the SDK this
      # repository already tests on, rather than a second pin that drifts away
      # from it. Shorebird only offers Flutter versions it has built its engine
      # for, so if it does not have this one, the list printed here says what it
      # does have.
      - name: Which Flutter version to build with
        id: flutter
        run: |
          set -uo pipefail
          V="${{ inputs.flutter_version }}"
          if [ -z "${V}" ]; then
            V="$(grep -oE "flutter-version:[[:space:]]*'?[0-9]+\.[0-9]+\.[0-9]+'?" .github/workflows/ci.yml \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          fi
          if [ -z "${V}" ]; then
            echo "::error::Could not read flutter-version from ci.yml. Re-run and set flutter_version (or 'latest')."
            exit 1
          fi
          echo "Building with Flutter ${V}"
          echo "--- Flutter versions Shorebird offers ---"
          shorebird flutter versions list || true
          echo "flutter_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Shorebird release Android
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          flutter-version: ${{ steps.flutter.outputs.flutter_version }}
          args: ${{ inputs.dry_run == true && '--no-confirm --dry-run' || '--no-confirm' }}

  release-ios:
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'ios' || inputs.platform == 'both'))
    needs: preflight
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # shorebird-release declares flutter-version as REQUIRED and forwards it
      # unconditionally - `shorebird release <platform> --flutter-version "$V"`
      # - so leaving it out sends an empty string and the CLI answers:
      #
      #     Flutter  is not available to Shorebird.
      #
      # That doubled space IS the empty version, and nothing in the message
      # points back at a missing workflow input. It is what the first real
      # release attempt died on.
      #
      # The version is read from ci.yml so a release is built on the SDK this
      # repository already tests on, rather than a second pin that drifts away
      # from it. Shorebird only offers Flutter versions it has built its engine
      # for, so if it does not have this one, the list printed here says what it
      # does have.
      - name: Which Flutter version to build with
        id: flutter
        run: |
          set -uo pipefail
          V="${{ inputs.flutter_version }}"
          if [ -z "${V}" ]; then
            V="$(grep -oE "flutter-version:[[:space:]]*'?[0-9]+\.[0-9]+\.[0-9]+'?" .github/workflows/ci.yml \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          fi
          if [ -z "${V}" ]; then
            echo "::error::Could not read flutter-version from ci.yml. Re-run and set flutter_version (or 'latest')."
            exit 1
          fi
          echo "Building with Flutter ${V}"
          echo "--- Flutter versions Shorebird offers ---"
          shorebird flutter versions list || true
          echo "flutter_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Shorebird release iOS
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: ios
          flutter-version: ${{ steps.flutter.outputs.flutter_version }}
          args: ${{ inputs.dry_run == true && '--no-confirm --dry-run' || '--no-confirm' }}

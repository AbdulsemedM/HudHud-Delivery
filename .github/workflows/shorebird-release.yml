# Creates a Shorebird release (store binary). Requires SHOREBIRD_TOKEN secret.
# Trigger: push tag v* (e.g. v1.0.0+12) or manual workflow_dispatch.
#
# Android runs on ubuntu. iOS requires macos and signing setup.
# Upload the produced artifact to Play / App Store Connect as usual.
#
# Signing: android/key.properties is generated from repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
# ANDROID_STORE_PASSWORD. Release builds fail without it (no debug-key fallback).
#
# App config: BASE_URL / SUPPORT_PHONE are compile-time dart-defines with
# production defaults (lib/app/config/app_env.dart). To override, append e.g.
#   args: --no-confirm -- --dart-define=BASE_URL=https://...
# No .env file is needed or bundled.

name: Shorebird Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - both

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  release-android:
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'android' ||
      inputs.platform == 'both'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create android/key.properties from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::Missing repository secret ${v}; release builds require the upload keystore."
              exit 1
            fi
          done
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"
          {
            echo "storeFile=${RUNNER_TEMP}/upload-keystore.jks"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/key.properties

      - name: Shorebird release Android
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          args: --no-confirm

  release-ios:
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'ios' || inputs.platform == 'both'))
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird release iOS
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: ios
          args: --no-confirm

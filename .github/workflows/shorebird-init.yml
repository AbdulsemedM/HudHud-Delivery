# One-off: register this app with Shorebird and commit the result.
#
# Runs in CI on purpose. `shorebird init` needs the Shorebird API key, which
# already lives in this repository's secrets - so the key never has to be
# copied onto anybody's laptop, and nobody needs the Shorebird CLI installed
# to get this app registered.
#
# It opens a PULL REQUEST rather than pushing to the default branch: the thing
# being added is an app_id that decides where every future patch is delivered,
# and that deserves to be looked at before it lands.
#
# Delete this workflow once both apps are initialised. It is not part of the
# release cycle.

name: Shorebird Init (one-off)

on:
  workflow_dispatch:
    inputs:
      display_name:
        description: App name as it will appear in the Shorebird console
        required: true
        type: string
      org_id:
        description: >-
          Shorebird organisation id. Leave blank on the first run - the job
          prints the organisations it can see and uses the only one if there
          is exactly one.
        required: false
        type: string
      force:
        description: >-
          Replace an existing shorebird.yaml. Needed for an app whose
          committed app_id is dead. Do NOT use on an app with live releases -
          installed builds keep asking for the OLD app_id and would stop
          receiving patches.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  init:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Token is present
        run: |
          set -uo pipefail
          if [ -z "${SHOREBIRD_TOKEN:-}" ]; then
            echo "::error::SHOREBIRD_TOKEN is not set on this repository."
            exit 1
          fi
          echo "ok  SHOREBIRD_TOKEN present"

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Which organisations can this key see
        id: orgs
        run: |
          set -uo pipefail
          echo "Organisations visible to this API key:"
          shorebird orgs list | tee /tmp/orgs.txt || {
            echo "::error::Could not list organisations. The API key may be invalid or revoked."
            exit 1
          }

          ORG="${{ inputs.org_id }}"

          if [ -z "${ORG}" ]; then
            # `shorebird orgs list` prints one org per line, id first:
            #
            #     63007  HudHud Delivery  team  developer
            #
            # The id is a SMALL INTEGER, not a UUID - an earlier version of this
            # step matched UUIDs and so found nothing in a list that plainly had
            # one organisation in it. Progress lines ("Done Fetching
            # organizations") are filtered out by requiring a leading number.
            mapfile -t FOUND < <(grep -oE '^[[:space:]]*[0-9a-fA-F-]{3,}[[:space:]]' /tmp/orgs.txt | tr -d '[:space:]' | sort -u)
            if [ "${#FOUND[@]}" -eq 1 ]; then
              ORG="${FOUND[0]}"
              echo "Using the only organisation found: ${ORG}"
            else
              echo "::error::Found ${#FOUND[@]} organisations. Re-run this workflow and put the right id in org_id, copied from the list above."
              exit 1
            fi
          fi

          echo "org_id=${ORG}" >> "$GITHUB_OUTPUT"

      # --force is refused unless asked for, because regenerating an app_id on
      # an app that has live releases silently orphans every installed build:
      # they keep asking for the old id and simply never get another patch.
      - name: Guard an existing shorebird.yaml
        run: |
          set -uo pipefail
          if [ -f shorebird.yaml ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::error::shorebird.yaml already exists. If its app_id is dead, re-run with force = true. If the app has live releases, do NOT."
            cat shorebird.yaml
            exit 1
          fi
          echo "ok  safe to write shorebird.yaml"

      - name: shorebird init
        run: |
          set -euo pipefail
          ARGS=(--org-id "${{ steps.orgs.outputs.org_id }}" --display-name "${{ inputs.display_name }}")
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          echo "shorebird init ${ARGS[*]}"
          # Creating an app inside an organisation may need more than the
          # `developer` role this key currently holds, and the CLI's own error
          # for that is not obvious. Say so here rather than leaving somebody
          # to guess at a permission failure.
          if ! shorebird init "${ARGS[@]}"; then
            echo "::error::shorebird init failed. If it mentions permissions or access, the API key's role in this organisation is too low to create an app - `shorebird orgs list` showed it as 'developer'. An owner or admin must either raise that role or create the app in the Shorebird console and hand over its app_id."
            exit 1
          fi

      - name: Show what was written
        run: |
          set -uo pipefail
          echo "--- shorebird.yaml ---"
          cat shorebird.yaml
          echo
          echo "--- pubspec.yaml assets ---"
          grep -n -A6 '^  assets:' pubspec.yaml || true
          if ! grep -q 'shorebird.yaml' pubspec.yaml; then
            echo "::error::shorebird.yaml is not listed under pubspec assets. The updater reads it at runtime; without it a downloaded patch is silently ignored."
            exit 1
          fi

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/shorebird-init-${GITHUB_RUN_ID}"
          APP_ID="$(grep -E '^app_id:' shorebird.yaml | awk '{print $2}')"

          cat > /tmp/body.md <<EOF
          Generated by the Shorebird Init workflow (run ${GITHUB_RUN_ID}).

          **app_id:** \`${APP_ID}\`

          This is what decides where patches are delivered, so it is worth a
          look before it lands.

          \`pubspec.yaml\` now lists \`shorebird.yaml\` under assets. The updater
          reads that file at runtime - without it, a downloaded patch is
          silently ignored.

          **Next step after merging:** one \`shorebird release\`, and that build
          distributed to testers. A patch only applies to a build produced by
          \`shorebird release\` - a plain \`flutter build\` contains no updater
          and can never receive one.
          EOF
          sed -i 's/^          //' /tmp/body.md

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add shorebird.yaml pubspec.yaml
          git commit -F - <<EOF
          Register this app with Shorebird

          Generated by the Shorebird Init workflow, which runs shorebird init in
          CI so the API key never leaves GitHub.

          app_id: ${APP_ID}

          The app_id decides which app Shorebird delivers patches to.
          pubspec.yaml now lists shorebird.yaml under assets - the updater reads
          it at runtime, and without it a downloaded patch is silently ignored.
          EOF

          git push -u origin "${BRANCH}"
          gh pr create \
            --title "Register this app with Shorebird" \
            --body-file /tmp/body.md \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH}"

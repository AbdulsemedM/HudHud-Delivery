# Heap stays modest (4G + 2G metaspace crashed the daemon on 16 GB machines).
# R8 minify needs more than 512m metaspace or it fails with OutOfMemoryError: Metaspace.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation to avoid "different roots" error
# when project (D:) and Pub cache (C:) are on different drives
kotlin.incremental=false
# Built-in Kotlin (AGP 8.11 / Flutter 3.32+)
android.builtInKotlin=true
android.newDsl=false

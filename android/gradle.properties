# Keep heap modest on 16 GB machines — 4G heap + 2G metaspace was crashing the daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation to avoid "different roots" error
# when project (D:) and Pub cache (C:) are on different drives
kotlin.incremental=false
# Built-in Kotlin (AGP 8.11 / Flutter 3.32+)
android.builtInKotlin=true
android.newDsl=false

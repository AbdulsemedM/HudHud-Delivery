org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation to avoid "different roots" error
# when project (D:) and Pub cache (C:) are on different drives
kotlin.incremental=false
# Flutter 3.44 / Shorebird: Built-in Kotlin (required by image_picker_android 0.8.13+18+)
android.builtInKotlin=true
android.newDsl=false
